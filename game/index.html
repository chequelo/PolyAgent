<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>OPERATION LONGSHOT — Sniper</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <!-- Scope overlay (SVG for crisp lines) -->
    <div id="scope" class="hidden">
      <div class="scope-vignette"></div>
      <svg class="scope-reticle" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="scopeGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
            <stop offset="72%" stop-color="rgba(0,0,0,0)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
          </radialGradient>
        </defs>
        <circle cx="500" cy="500" r="498" fill="url(#scopeGlow)"/>
        <g stroke="#0a0a0a" stroke-width="2.2" opacity="0.92">
          <line x1="500" y1="120" x2="500" y2="430"/>
          <line x1="500" y1="570" x2="500" y2="880"/>
          <line x1="120" y1="500" x2="430" y2="500"/>
          <line x1="570" y1="500" x2="880" y2="500"/>
        </g>
        <g stroke="#0a0a0a" stroke-width="1.4" opacity="0.85">
          <line x1="500" y1="560" x2="500" y2="720"/>
          <line x1="470" y1="600" x2="530" y2="600"/>
          <line x1="478" y1="650" x2="522" y2="650"/>
          <line x1="486" y1="700" x2="514" y2="700"/>
          <line x1="440" y1="500" x2="440" y2="512"/>
          <line x1="560" y1="500" x2="560" y2="512"/>
          <line x1="380" y1="500" x2="380" y2="516"/>
          <line x1="620" y1="500" x2="620" y2="516"/>
        </g>
        <circle cx="500" cy="500" r="2.6" fill="#c0392b"/>
      </svg>
      <div class="scope-ring"></div>
      <div class="scope-info">
        <span id="scopeZoom">6.0x</span>
        <span id="scopeWind">WIND 3 R</span>
      </div>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div class="crosshair" id="crosshair">
        <span class="ch ch-t"></span><span class="ch ch-b"></span>
        <span class="ch ch-l"></span><span class="ch ch-r"></span>
      </div>
      <div id="hitmarker" class="hitmarker"></div>
      <div id="damage" class="damage-vignette"></div>

      <div class="hud-bottom-left">
        <div class="stat">
          <div class="stat-label">HEALTH</div>
          <div class="bar"><div id="healthbar" class="bar-fill health"></div></div>
        </div>
        <div class="stat">
          <div class="stat-label">STAMINA</div>
          <div class="bar"><div id="staminabar" class="bar-fill stamina"></div></div>
        </div>
      </div>

      <div class="hud-bottom-right">
        <div class="ammo">
          <span id="ammoMag">5</span><span class="ammo-sep">/</span><span id="ammoReserve">30</span>
        </div>
        <div class="weapon-name">M82 · .50 BMG</div>
      </div>

      <div class="hud-top-left">
        <div class="objective">◆ ELIMINATE ALL HOSTILES</div>
        <div class="score">SCORE <span id="score">0</span></div>
      </div>

      <div id="killfeed" class="killfeed"></div>
      <div id="breath" class="breath hidden">HOLD BREATH — <b>SHIFT</b></div>
    </div>

    <!-- Start / pause menu -->
    <div id="menu" class="menu">
      <div class="menu-inner">
        <h1>OPERATION <span>LONGSHOT</span></h1>
        <p class="tag">A silent-scope sniper engagement · WebGL / Three.js</p>
        <button id="startBtn">DEPLOY</button>
        <div class="controls">
          <div><kbd>WASD</kbd> move</div>
          <div><kbd>MOUSE</kbd> look</div>
          <div><kbd>RMB</kbd> scope</div>
          <div><kbd>LMB</kbd> fire</div>
          <div><kbd>SHIFT</kbd> hold breath</div>
          <div><kbd>R</kbd> reload</div>
          <div><kbd>SPACE</kbd> jump</div>
          <div><kbd>ESC</kbd> pause</div>
        </div>
      </div>
    </div>

    <div id="loading" class="loading"><div class="loading-bar"><div id="loadingFill"></div></div><span>DEPLOYING…</span></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
